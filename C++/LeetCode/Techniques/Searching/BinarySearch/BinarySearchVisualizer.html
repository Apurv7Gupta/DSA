<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --cell-size: 54px;
        --cell-gap: 6px;
        --accent: #3b82f6;
        --bg: #0f172a;
        --surface: #1e293b;
        --border: #334155;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #f59e0b;
      }
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          monospace;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .root {
        padding: 2rem 1rem;
        max-width: 900px;
        margin: 0 auto;
      }

      /* Controls */
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        background: var(--surface);
        padding: 1rem;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .controls label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .controls input {
        padding: 8px 12px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--text);
        outline: none;
      }
      .controls input:focus {
        border-color: var(--accent);
      }

      button {
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        transition: all 0.2s;
      }
      button:hover:not(:disabled) {
        background: #2d3a4f;
        border-color: var(--text-muted);
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        color: white;
        border: none;
      }
      .btn-primary:hover:not(:disabled) {
        background: #2563eb;
        transform: translateY(-1px);
      }

      /* Visualization Area */
      .array-container {
        position: relative;
        margin-top: 50px;
        margin-bottom: 20px;
      }
      .array-wrap {
        overflow-x: auto;
        padding: 20px 0;
        scrollbar-width: thin;
      }
      .array-row {
        display: flex;
        gap: var(--cell-gap);
        min-width: max-content;
        padding: 10px;
      }

      .cell {
        width: var(--cell-size);
        height: var(--cell-size);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        position: relative;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        flex-shrink: 0;
      }
      .cell .idx {
        position: absolute;
        top: -22px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: var(--text-muted);
      }

      /* Pointer Animations */
      .pointer {
        position: absolute;
        bottom: -30px;
        width: var(--cell-size);
        text-align: center;
        font-size: 12px;
        font-weight: 800;
        transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        z-index: 10;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .ptr-s {
        color: var(--accent);
      }
      .ptr-e {
        color: var(--danger);
      }
      .ptr-m {
        color: var(--warning);
        bottom: -45px;
      }

      /* States */
      .cell.is-ans {
        background: var(--success);
        border-color: #4ade80;
        color: white;
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
      }
      .cell.is-mid {
        border: 2px solid var(--warning);
        transform: scale(1.05);
        z-index: 5;
      }
      .cell.is-out {
        opacity: 0.2;
        grayscale: 100%;
      }

      .legend {
        display: flex;
        gap: 20px;
        margin: 10px 0;
        padding: 10px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
      }
      .leg {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }
      .dot-s {
        background: var(--accent);
      }
      .dot-e {
        background: var(--danger);
      }
      .dot-m {
        border: 2px solid var(--warning);
      }
      .dot-a {
        background: var(--success);
      }

      /* Info Boxes */
      .step-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        min-height: 160px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      .step-box .iter {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--accent);
        letter-spacing: 0.05em;
        margin-bottom: 8px;
      }
      .step-box .vars {
        display: flex;
        gap: 20px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
      }
      .step-box .vk {
        font-size: 12px;
        color: var(--text-muted);
      }
      .step-box .vv {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }

      .branch {
        padding: 10px 14px;
        border-radius: 8px;
        margin-top: 8px;
        font-size: 13px;
        border-left: 4px solid transparent;
        background: rgba(255, 255, 255, 0.02);
      }
      .branch-active {
        background: rgba(245, 158, 11, 0.1);
        border-left-color: var(--warning);
        color: #fbbf24;
        font-weight: 600;
      }
      .branch-inactive {
        opacity: 0.3;
      }

      .mode-tabs {
        display: flex;
        margin-bottom: 1rem;
        background: var(--surface);
        padding: 4px;
        border-radius: 8px;
        width: max-content;
      }
      .mode-tab {
        padding: 6px 16px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
      }
      .mode-tab.active {
        background: var(--accent);
        color: white;
      }

      .nav {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 1rem;
      }
      .auto-row {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
      }

      #step-counter {
        font-weight: 700;
        min-width: 100px;
        text-align: center;
      }
      #speed-range {
        accent-color: var(--accent);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="root">
      <div class="controls">
        <div>
          <label>Sorted Array</label><br />
          <input type="text" id="arr-input" value="1,1,2,3,4,4,4,7,8,9" />
        </div>
        <div>
          <label>Target Key</label><br />
          <input type="number" id="key-input" value="4" />
        </div>
        <button class="btn-primary" style="margin-top: 18px" onclick="init()">
          Run Simulation
        </button>
      </div>

      <div class="mode-tabs">
        <button
          class="mode-tab active"
          id="tab-first"
          onclick="setMode('first')"
        >
          First occurrence
        </button>
        <button class="mode-tab" id="tab-last" onclick="setMode('last')">
          Last occurrence
        </button>
      </div>

      <div class="legend">
        <div class="leg">
          <div class="dot dot-s"></div>
          Start
        </div>
        <div class="leg">
          <div class="dot dot-e"></div>
          End
        </div>
        <div class="leg">
          <div class="dot dot-m"></div>
          Mid
        </div>
        <div class="leg">
          <div class="dot dot-a"></div>
          Answer
        </div>
      </div>

      <div class="array-container">
        <div id="ptr-s" class="pointer ptr-s">S ▲</div>
        <div id="ptr-e" class="pointer ptr-e">E ▲</div>
        <div id="ptr-m" class="pointer ptr-m">M ▲</div>

        <div class="array-wrap">
          <div class="array-row" id="array-row"></div>
        </div>
      </div>

      <div id="result-banner" style="margin-bottom: 1rem; height: 24px"></div>

      <div class="step-box" id="step-box"></div>

      <div class="nav">
        <button id="btn-prev" onclick="go(-1)" disabled>Previous</button>
        <span id="step-counter"></span>
        <button id="btn-next" onclick="go(1)" disabled>Next Step</button>
      </div>

      <div class="auto-row">
        <button id="btn-auto" onclick="toggleAuto()" disabled>
          ▶ Auto-play
        </button>
        <input type="range" min="300" max="1500" value="800" id="speed-range" />
        <label>Playback Speed</label>
      </div>
    </div>

    <script>
      let mode = "first";
      let steps = [];
      let cur = 0;
      let autoTimer = null;

      function setMode(m) {
        mode = m;
        document
          .getElementById("tab-first")
          .classList.toggle("active", m === "first");
        document
          .getElementById("tab-last")
          .classList.toggle("active", m === "last");
        init();
      }

      function parseArr() {
        return document
          .getElementById("arr-input")
          .value.split(",")
          .map((x) => parseInt(x.trim()))
          .filter((x) => !isNaN(x))
          .sort((a, b) => a - b);
      }

      function computeSteps(arr, key, findFirst) {
        const steps = [];
        let start = 0,
          end = arr.length - 1,
          ans = -1;
        steps.push({ start, end, mid: null, ans, branch: "init", done: false });

        while (start <= end) {
          const mid = Math.floor(start + (end - start) / 2);
          const val = arr[mid];
          let branch = val === key ? "eq" : val > key ? "gt" : "lt";
          steps.push({ start, end, mid, ans, branch, done: false });

          if (val === key) {
            ans = mid;
            if (findFirst) end = mid - 1;
            else start = mid + 1;
          } else if (val > key) {
            end = mid - 1;
          } else {
            start = mid + 1;
          }
        }
        steps.push({ start, end, mid: null, ans, branch: "done", done: true });
        return steps;
      }

      function init() {
        clearAuto();
        const arr = parseArr();
        const key = parseInt(document.getElementById("key-input").value);
        steps = computeSteps(arr, key, mode === "first");
        cur = 0;

        const container = document.getElementById("array-row");
        container.innerHTML = "";
        arr.forEach((val, i) => {
          const div = document.createElement("div");
          div.className = "cell";
          div.id = `cell-${i}`;
          div.innerHTML = `${val}<span class="idx">${i}</span>`;
          container.appendChild(div);
        });

        render();
        document.getElementById("btn-prev").disabled = false;
        document.getElementById("btn-next").disabled = false;
        document.getElementById("btn-auto").disabled = false;
      }

      function movePointer(id, index, visible) {
        const el = document.getElementById(id);
        if (
          index === null ||
          index < 0 ||
          index >= parseArr().length ||
          !visible
        ) {
          el.style.opacity = "0";
          return;
        }
        const cellSize = 54;
        const gap = 6;
        const x = index * (cellSize + gap);
        el.style.opacity = "1";
        el.style.transform = `translateX(${x}px)`;
      }

      function render() {
        if (!steps.length) return;
        const s = steps[cur];
        const arr = parseArr();
        const key = parseInt(document.getElementById("key-input").value);

        movePointer("ptr-s", s.start, !s.done);
        movePointer("ptr-e", s.end, !s.done);
        movePointer("ptr-m", s.mid, s.mid !== null);

        arr.forEach((_, i) => {
          const cell = document.getElementById(`cell-${i}`);
          cell.className = "cell";
          if (s.done) {
            if (i === s.ans) cell.classList.add("is-ans");
            else cell.classList.add("is-out");
          } else {
            if (i < s.start || i > s.end) cell.classList.add("is-out");
            if (i === s.mid) cell.classList.add("is-mid");
          }
        });

        const box = document.getElementById("step-box");
        if (s.branch === "init") {
          box.innerHTML = `<div class="iter">State: Initialization</div><div class="vars"><span class="vk">start:</span><span class="vv">${s.start}</span> <span class="vk">end:</span><span class="vv">${s.end}</span></div><p>Searching for key: <b style="color:var(--accent)">${key}</b></p>`;
        } else if (s.done) {
          box.innerHTML = `<div class="iter">State: Complete</div><div class="vars"><span class="vk">Result Index:</span><span class="vv">${s.ans}</span></div><p>${s.ans === -1 ? "❌ Key not found in array." : "✅ Target found at index " + s.ans + "."}</p>`;
        } else {
          const midVal = arr[s.mid];
          box.innerHTML = `
      <div class="iter">Iteration Step ${cur}</div>
      <div class="vars">
        <div class="var"><span class="vk">mid:</span><span class="vv" style="color:var(--warning)">${s.mid}</span></div>
        <div class="var"><span class="vk">arr[mid]:</span><span class="vv">${midVal}</span></div>
        <div class="var"><span class="vk">last_ans:</span><span class="vv">${s.ans}</span></div>
      </div>
      <div class="branch ${s.branch === "eq" ? "branch-active" : "branch-inactive"}">
        if (arr[mid] == key) → Found! Update answer, continue searching.
      </div>
      <div class="branch ${s.branch === "gt" ? "branch-active" : "branch-inactive"}">
        if (arr[mid] > key) → Value too high. Move end to mid - 1.
      </div>
      <div class="branch ${s.branch === "lt" ? "branch-active" : "branch-inactive"}">
        else → Value too low. Move start to mid + 1.
      </div>
    `;
        }

        const banner = document.getElementById("result-banner");
        banner.innerHTML = s.done
          ? `<div style="color:var(--success); font-size:14px; font-weight:bold;">Search Finished. Index: ${s.ans}</div>`
          : "";
        document.getElementById("step-counter").textContent =
          `Step ${cur + 1} / ${steps.length}`;
        document.getElementById("btn-prev").disabled = cur === 0;
        document.getElementById("btn-next").disabled = cur === steps.length - 1;
      }

      function go(d) {
        cur = Math.max(0, Math.min(steps.length - 1, cur + d));
        render();
      }

      function toggleAuto() {
        if (autoTimer) {
          clearAuto();
          return;
        }
        document.getElementById("btn-auto").textContent = "⏸ Pause";
        const play = () => {
          if (cur >= steps.length - 1) {
            clearAuto();
            return;
          }
          go(1);
          autoTimer = setTimeout(
            play,
            document.getElementById("speed-range").value,
          );
        };
        play();
      }

      function clearAuto() {
        clearTimeout(autoTimer);
        autoTimer = null;
        document.getElementById("btn-auto").textContent = "▶ Auto-play";
      }

      init();
    </script>
  </body>
</html>
